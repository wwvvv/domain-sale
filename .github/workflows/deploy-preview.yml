name: Deploy Preview
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: domain-sale-preview
  cancel-in-progress: false
jobs:
  deploy-preview:
    # Enabled only after secrets and branch review rules are configured.
    if: ${{ vars.DOMAIN_SALE_AUTO_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)) }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify tests before publishing
        run: npm test
      - name: Enforce preview-only deployment
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module -e "
            import fs from 'node:fs';
            const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            if (c.name !== 'domain-sale-preview' || c.workers_dev !== true ||
                c.route || c.routes || c.env || c.triggers) {
              throw new Error('Expected dedicated workers.dev-only preview Worker');
            }
          "
      - name: Deploy domain-sale-preview Worker
        run: npx wrangler deploy --name domain-sale-preview
      - name: HTTPS smoke test live preview
        run: |
          set -euo pipefail
          BASE='https://domain-sale-preview.ddli.workers.dev/'
          DOMAIN=$(node --input-type=module -e "import d from './src/domains.json' with {type:'json'}; process.stdout.write(Object.entries(d).find(([k,v])=>v.status==='for_sale')?.[0]||'')")
          if [ -n "$DOMAIN" ]; then
            curl --fail-with-body -sS --retry 5 --retry-all-errors --retry-delay 2 --max-time 40 \
              -D /tmp/domain-sale-headers -o /tmp/domain-sale-body "${BASE}?preview=${DOMAIN}"
            grep -Fq 'DOMAIN FOR SALE' /tmp/domain-sale-body
            grep -Fq "$DOMAIN" /tmp/domain-sale-body
            grep -qi '^x-robots-tag: noindex, nofollow' /tmp/domain-sale-headers
          fi
          CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$BASE")
          test "$CODE" = '404'
