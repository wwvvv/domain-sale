name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Smoke test deployed workers.dev preview
        run: |
          set -euo pipefail
          PREVIEW='https://domain-sale-preview.ddli.workers.dev/?preview=example.com'
          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -D /tmp/domain-sale-headers \
            -o /tmp/domain-sale-preview.html "$PREVIEW"
          grep -q 'DOMAIN FOR SALE' /tmp/domain-sale-preview.html
          grep -q 'example.com' /tmp/domain-sale-preview.html
          grep -qi '^x-robots-tag: noindex, nofollow' /tmp/domain-sale-headers
          CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            'https://domain-sale-preview.ddli.workers.dev/')
          test "$CODE" = '404'
