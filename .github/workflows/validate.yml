name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Syntax-check admin and Worker
        run: |
          node --check admin/model.js
          node --check admin/app.js
          node --check src/index.js
      - name: Verify Wrangler build without deploying
        run: npx wrangler deploy --name domain-sale-preview --dry-run --outdir dist
      - name: Install Chromium for UI regression
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and mobile layout tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-manager-visual-acceptance
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
