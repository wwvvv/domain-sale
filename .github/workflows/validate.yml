name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate domain inventory
        run: npm run check:domains
      - name: Run tests
        run: npm test
      - name: Syntax-check Worker
        run: |
          node --check src/index.js
          node --check scripts/validate-domains.mjs
      - name: Wrangler dry-run (no deployment)
        run: npx wrangler deploy --dry-run --outdir dist
