name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Syntax-check admin and Worker
        run: |
          node --check admin/model.js
          node --check admin/app.js
          node --check src/index.js
      - name: Verify Wrangler build without deploying
        run: npx wrangler deploy --name domain-sale-preview --dry-run --outdir dist
